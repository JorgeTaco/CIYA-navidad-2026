name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verificar aplicación
        run: bash scripts/check.sh
      - name: Preparar sitio estático
        run: bash scripts/deploy-static.sh "$RUNNER_TEMP/ciya-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ciya-pages

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar rutas publicadas
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          check_page() {
            local path="$1" marker="$2" response="$RUNNER_TEMP/ciya-page"
            for attempt in {1..10}; do
              if curl --fail --silent --show-error --max-time 10 \
                "${PAGE_URL%/}/$path?revision=$GITHUB_SHA" -o "$response" && grep -Fq "$marker" "$response"; then
                return 0
              fi
              sleep 5
            done
            printf 'El sitio publicado no contiene la página esperada en /%s\n' "$path" >&2
            return 1
          }
          check_page '' 'id="acceso-root"'
          check_page 'portal.html' 'id="portal-root"'
          check_page 'qr.html' 'id="qr-root"'
          check_page 'bases.html' 'id="cronograma"'
          check_page 'recepcion.html' 'id="recepcion-root"'
          check_page 'admin.html' 'id="admin-root"'
          check_page 'escenario.html' 'id="escenario-root"'
          check_page 'apps/web/qr.html' 'location.replace(target.href)'
